name: Prostec Scraper — cron gratuito (substitui o cron da Vercel)

# A Vercel só permite cron nativo com frequência menor que 1x/dia no
# plano PRO — no Hobby (grátis), uma entrada de cron a cada 2 minutos
# no vercel.json é REJEITADA pela Vercel (o deploy nem aparece na aba
# Deployments). Esse workflow substitui o cron nativo sem custo: a
# rota /api/prostec/scraper/cron não liga quem a chama, só confere o
# header Authorization com o CRON_SECRET — então funciona igual.
#
# Configuração necessária (uma vez só), em
# github.com/nhew-hash/neotec-os → Settings → Secrets and variables → Actions:
#   - NEOTEC_OS_URL   → ex: https://neotec-os.vercel.app (seu domínio de produção, sem barra no final)
#   - CRON_SECRET     → o MESMO valor da env CRON_SECRET configurada na Vercel

on:
  schedule:
    # A cada 5 minutos — o mínimo confiável em execuções agendadas do
    # GitHub Actions (a plataforma pode atrasar agendamentos muito
    # frequentes, tipo */2, em horários de pico). Ajuste se quiser
    # tentar mais frequente, mas 5 min já é suficiente: o cron só
    # avança a fila e faz o enriquecimento em lote, não tem pressa.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite disparar manualmente em Actions → Run workflow, útil pra testar

jobs:
  chamar-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/prostec/scraper/cron
        run: |
          curl -sS -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEOTEC_OS_URL }}/api/prostec/scraper/cron"
